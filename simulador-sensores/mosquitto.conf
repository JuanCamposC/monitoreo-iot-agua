# Configuración Mosquitto para desarrollo local
# Permite conexiones anónimas y habilita websockets

listener 1883
protocol mqtt

listener 9001
protocol websockets

allow_anonymous true

# Logs
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

# Persistencia
persistence true
persistence_location /mosquitto/data/

# Límites
max_connections 100
max_inflight_messages 20
max_queued_messages 1000