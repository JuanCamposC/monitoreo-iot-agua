services:
  # Simulador IoT Principal
  cimarq-iot-simulator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cimarq-iot-simulator
    restart: unless-stopped
    
    # Variables de entorno (usa configuración del backend)
    environment:
      # MongoDB (idénticas al backend)
      - MONGO_URI=${MONGO_URI:-mongodb+srv://cimarq:eGEr87FyYHIadm4p@proyectotitulo.idqwtmo.mongodb.net/}
      - DB_NAME=${DB_NAME:-cimarq}
      
      # MQTT (idénticas al backend)  
      - MQTT_BROKER=${MQTT_BROKER:-test.mosquitto.org}
      - MQTT_PORT=${MQTT_PORT:-1883}
      - MQTT_USERNAME=${MQTT_USERNAME:-}
      - MQTT_PASSWORD=${MQTT_PASSWORD:-}
      
      # Tópicos MQTT (exactos del backend)
      - TEMPERATURA_TOPIC=${TEMPERATURA_TOPIC:-cimarq/temperatura/update}
      - PH_TOPIC=${PH_TOPIC:-cimarq/ph/update}
      - OXIGENO_TOPIC=${OXIGENO_TOPIC:-cimarq/oxigeno/update}
      
      # Configuración del simulador
      - SIMULATION_INTERVAL=${SIMULATION_INTERVAL:-300}  # 5 minutos
      - NUM_SENSORS=${NUM_SENSORS:-3}
      
      # Python
      - PYTHONUNBUFFERED=1
      - TZ=America/Santiago
    
    # Montar configuración del backend como volumen (opcional)
    volumes:
      - ../backend/.env:/app/.env:ro  # Solo lectura
      - ./logs:/app/logs
    
    # Límites de recursos para producción
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.5'
        reservations:
          memory: 64M
          cpus: '0.1'
    
    # Configuración de red
    networks:
      - cimarq-network
    
    # Logging
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    
    # Health check personalizado
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import sys; import os; sys.exit(0 if os.path.exists(\"/app/simulador_iot.log\") else 1)'"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

  # MongoDB Local (solo para desarrollo/testing)
  mongodb-dev:
    image: mongo:7.0
    container_name: cimarq-mongodb-dev
    restart: unless-stopped
    profiles:
      - dev  # Solo con --profile dev
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=cimarq123
      - MONGO_INITDB_DATABASE=cimarq
    ports:
      - "27017:27017"
    volumes:
      - mongodb_dev_data:/data/db
    networks:
      - cimarq-network

  # Mosquitto MQTT (solo para desarrollo/testing)
  mqtt-dev:
    image: eclipse-mosquitto:2.0
    container_name: cimarq-mqtt-dev  
    restart: unless-stopped
    profiles:
      - dev  # Solo con --profile dev
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    networks:
      - cimarq-network
    command: mosquitto -c /mosquitto/config/mosquitto.conf

  # Monitor de logs (opcional)
  log-monitor:
    image: alpine:latest
    container_name: cimarq-log-monitor
    restart: unless-stopped
    profiles:
      - monitor  # Solo con --profile monitor
    volumes:
      - ./logs:/logs:ro
    command: tail -f /logs/simulador_iot.log
    depends_on:
      - cimarq-iot-simulator

# Volúmenes
volumes:
  mongodb_dev_data:
    driver: local

# Red personalizada
networks:
  cimarq-network:
    driver: bridge
    name: cimarq-iot-network