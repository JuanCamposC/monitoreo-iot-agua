services:
  api:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: sensores-api
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=development
      - FLASK_DEBUG=1
      # Variables de entorno para servicios en la nube
      - MONGO_URI=${MONGO_URI}
      - DB_NAME=${DB_NAME}
      - MQTT_BROKER=${MQTT_BROKER}
      - MQTT_PORT=${MQTT_PORT}
      - MQTT_USERNAME=${MQTT_USERNAME}
      - MQTT_PASSWORD=${MQTT_PASSWORD}
      # Variables de entorno para notificaciones por email
      - SMTP_SERVER=${SMTP_SERVER}
      - SMTP_PORT=${SMTP_PORT}
      - EMAIL_REMITENTE=${EMAIL_REMITENTE}
      - EMAIL_PASSWORD=${EMAIL_PASSWORD}
      - EMAIL_OPERADOR=${EMAIL_OPERADOR}
      - EMAIL_SUPERVISOR=${EMAIL_SUPERVISOR}
    volumes:
      # Solo para desarrollo - permite hot reload
      - ./src:/app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  default:
    name: sensores-network